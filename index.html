<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NTV HUB</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #f7fbff, #eef6ff);
      color: #123b63;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 16px 35px;
    }

    /* HEADER */

    header {
      position: relative;
      text-align: center;
      margin-bottom: 22px;
      min-height: 115px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    /* МІСЦЕ ДЛЯ ЛОГОТИПА */

    .logo-image {
      position: absolute;
      width: 170px;
      height: 170px;
      object-fit: contain;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.10;
      z-index: 0;
      pointer-events: none;
    }

    .logo,
    .subtitle {
      position: relative;
      z-index: 1;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #55c7ee, #1769d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6c89a5;
      font-size: 14px;
    }

    /* MAIN GRID */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* CARDS */

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #dcecff;
      border-radius: 15px;
      padding: 12px 13px;
      min-height: 70px;
      box-shadow: 0 5px 16px rgba(31, 105, 170, 0.07);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(31, 105, 170, 0.11);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
    }

    /* ICONS */

    .icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #e8f8ff, #dcecff);
      color: #1769d1;
      flex-shrink: 0;
    }

    .icon svg {
      width: 21px;
      height: 21px;
    }

    /* TITLE */

    .title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.15;
    }

    .arrow {
      margin-left: auto;
      color: #8aa7c2;
      font-size: 17px;
    }

    /* SUBMENU */

    .submenu {
      display: none;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e4eff8;
    }

    .submenu.open {
      display: block;
    }

    .submenu-item {
      padding: 8px;
      margin: 3px 0;
      border-radius: 8px;
      color: #315b7d;
      background: #f7fbff;
      cursor: pointer;
      font-size: 14px;
    }

    .submenu-item:hover {
      background: #edf7ff;
      color: #1769d1;
    }

    /* NESTED MENU */

    .nested {
      margin-left: 14px;
      display: none;
    }

    .nested.open {
      display: block;
    }

    .nested-item {
      padding: 7px 9px;
      color: #55758f;
      border-left: 2px solid #c9e9fa;
      margin-bottom: 2px;
      font-size: 13px;
    }

    /* АКТУАЛЬНЕ */

    .today {
      margin-top: 20px;
      padding: 10px 4px;
      border-top: 1px solid #bcdcf0;
      border-bottom: 1px solid #bcdcf0;
      text-align: center;
      color: #1769d1;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .container {
        padding: 18px 12px 25px;
      }

      header {
        min-height: 95px;
        margin-bottom: 17px;
      }

      .logo {
        font-size: 32px;
      }

      .subtitle {
        font-size: 12px;
      }

      .logo-image {
        width: 135px;
        height: 135px;
      }

      .grid {
        gap: 8px;
      }

      .card {
        padding: 9px 10px;
        min-height: 62px;
        border-radius: 13px;
      }

      .card-header {
        gap: 8px;
        min-height: 42px;
      }

      .icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }

      .icon svg {
        width: 19px;
        height: 19px;
      }

      .title {
        font-size: 13px;
      }

      .today {
        margin-top: 16px;
        padding: 8px 4px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <header>

      <!--
        ЛОГОТИП:
        Завантаж файл логотипа в GitHub
        з назвою logo.png.
        Він автоматично з'явиться тут
        напівпрозорим фоном.
      -->

      <img
        src="logo.png"
        alt=""
        class="logo-image"
      >

      <div class="logo">
        NTV HUB
      </div>

      <div class="subtitle">
        Навчально-тренувальний відділ ЕМД м. Рівне
      </div>

    </header>


    <!-- ГОЛОВНЕ МЕНЮ -->

    <div class="grid">


      <!-- ЕМД -->

      <div class="card" onclick="toggleMenu('emd')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="heart-pulse"></i>
          </div>

          <div class="title">
            ЕМД
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>

        <div id="emd" class="submenu">

          <div class="submenu-item">BLS</div>
          <div class="submenu-item">PBLS</div>
          <div class="submenu-item">ALS</div>
          <div class="submenu-item">Травма</div>
          <div class="submenu-item">Педіатрія</div>

        </div>

      </div>


      <!-- НАВЧАННЯ -->

      <div class="card" onclick="toggleMenu('education')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="graduation-cap"></i>
          </div>

          <div class="title">
            НАВЧАННЯ
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>

        <div id="education" class="submenu">

          <div
            class="submenu-item"
            onclick="toggleNested(event, 'courses')"
          >
            Курси
            <span style="float:right;">›</span>
          </div>

          <div id="courses" class="nested">

            <div class="nested-item">
              Онлайн
            </div>

            <div class="nested-item">
              Офлайн
            </div>

          </div>

          <div class="submenu-item">
            Тренінги
          </div>

          <div class="submenu-item">
            Практичні навички
          </div>

        </div>

      </div>


      <!-- ТЕСТИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="clipboard-check"></i>
          </div>

          <div class="title">
            ТЕСТИ
          </div>

        </div>

      </div>


      <!-- БПР -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="badge-check"></i>
          </div>

          <div class="title">
            БПР
          </div>

        </div>

      </div>


      <!-- НОРМАТИВНА БАЗА -->

      <div class="card" onclick="toggleMenu('norms')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="file-text"></i>
          </div>

          <div class="title">
            НОРМАТИВНА БАЗА
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>

        <div id="norms" class="submenu">

          <div class="submenu-item">
            Накази
          </div>

          <div class="submenu-item">
            Документи
          </div>

          <div class="submenu-item">
            Протоколи
          </div>

        </div>

      </div>


      <!-- ДОДАТКИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="layout-grid"></i>
          </div>

          <div class="title">
            ДОДАТКИ
          </div>

        </div>

      </div>


      <!-- НОВИНИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="newspaper"></i>
          </div>

          <div class="title">
            НОВИНИ
          </div>

        </div>

      </div>


      <!-- КОНТАКТИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="phone"></i>
          </div>

          <div class="title">
            КОНТАКТИ
          </div>

        </div>

      </div>

    </div>


    <!-- АКТУАЛЬНЕ СЬОГОДНІ -->

    <div class="today">
      АКТУАЛЬНЕ СЬОГОДНІ
    </div>

  </div>


  <script>

    lucide.createIcons();

    function toggleMenu(id) {
      const menu = document.getElementById(id);
      menu.classList.toggle("open");
    }

    function toggleNested(event, id) {
      event.stopPropagation();

      const menu = document.getElementById(id);
      menu.classList.toggle("open");
    }

  </script>

</body>
</html>
