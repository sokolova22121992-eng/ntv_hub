<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NTV HUB</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eaf8ff 0%, #f8fcff 100%);
      color: #123b5d;
    }

    /* =========================
       MAIN SCREEN
    ========================= */

    .main-screen {
      min-height: 100vh;
      padding: 24px 14px 20px;
      position: relative;
    }

    .header {
      text-align: center;
      padding-top: 8px;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #1769d1;
      letter-spacing: .5px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 13px;
      color: #52718a;
    }

    /* Main hamburger */

    .main-menu-button {
      position: absolute;
      right: 14px;
      top: 55px;
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 16px;
      background: white;
      color: #1769d1;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 16px rgba(31,105,170,.14);
      z-index: 100;
      cursor: pointer;
    }

    /* Main grid */

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      max-width: 620px;
      margin: 0 auto;
    }

    .menu-card {
      min-height: 74px;
      border: none;
      border-radius: 17px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 5px 16px rgba(31,105,170,.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #1769d1;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .menu-card svg {
      width: 23px;
      height: 23px;
      stroke-width: 1.8;
    }

    .menu-card:active,
    .main-menu-button:active,
    .chat-menu-button:active {
      transform: scale(.97);
    }

    /* Actual today */

    .actual-title {
      max-width: 620px;
      margin: 12px auto 0;
      height: 31px;
      border-radius: 10px;
      background: rgba(255,255,255,.72);
      border: 1px solid #dcecff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #6b8aa2;
    }

    .logo-image {
      display: block;
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin: 12px auto 0;
      opacity: 0.4;
    }

    /* =========================
       CHAT SCREEN
    ========================= */

    .chat-screen {
      display: none;
      min-height: 100vh;
      background: #f4fbff;
    }

    .chat-screen.active {
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 70px;
      background: linear-gradient(135deg, #1769d1, #159bd7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(23,105,209,.20);
    }

    /* Separate hamburger bar */

    .chat-menu-bar {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 8px 14px;
      background: #eef7fb;
      border-bottom: 1px solid #dcecff;
    }

    .chat-menu-button {
      width: 54px;
      height: 54px;
      border: none;
      border-radius: 16px;
      background: white;
      color: #1769d1;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 16px rgba(31,105,170,.14);
      z-index: 300;
      cursor: pointer;
    }

    .chat-body {
      height: calc(100vh - 140px);
      display: flex;
      flex-direction: column;
      padding: 14px;
    }

    .chat-placeholder {
      flex: 1;
      border-radius: 18px;
      background: white;
      border: 1px solid #e0eef6;
      box-shadow: 0 4px 15px rgba(31,105,170,.07);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #7b96aa;
      font-size: 14px;
      padding: 20px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .chat-input {
      flex: 1;
      height: 48px;
      border: 1px solid #d7e8f2;
      border-radius: 15px;
      padding: 0 15px;
      background: white;
      outline: none;
      font-size: 14px;
    }

    .chat-send {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 15px;
      background: #1769d1;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-send svg {
      width: 20px;
    }

    /* =========================
       SIDE PANEL
    ========================= */

    .side-panel-background {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(10,45,75,.30);
    }

    .side-panel-background.open {
      display: block;
    }

    .side-panel {
      position: absolute;
      left: 0;
      top: 0;
      width: min(310px, 84vw);
      height: 100%;
      background: white;
      padding: 25px 15px;
      box-shadow: 7px 0 25px rgba(0,0,0,.18);
      overflow-y: auto;
    }

    .side-panel-title {
      font-size: 20px;
      font-weight: 800;
      color: #1769d1;
      margin: 0 0 20px 8px;
    }

    .side-item {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 14px;
      background: #f4faff;
      margin-bottom: 8px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      color: #245675;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    .side-item:active {
      transform: scale(.98);
    }

    .side-item-icon {
      width: 28px;
      text-align: center;
      font-size: 20px;
    }

    /* Developer */

    .developer-credit {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 40;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .4px;
      color: transparent;
      -webkit-text-stroke: 0.6px rgba(23,105,209,.45);
      opacity: .65;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 420px) {

      .main-screen {
        padding-top: 20px;
      }

      .header h1 {
        font-size: 26px;
      }

      .header p {
        font-size: 12px;
      }

      .main-menu-button {
        top: 52px;
      }

      .menu-card {
        min-height: 70px;
      }

      .menu-card svg {
        width: 21px;
        height: 21px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       MAIN
  ========================= -->

  <main class="main-screen" id="mainScreen">

    <button class="main-menu-button" onclick="openChat()" aria-label="Відкрити чат">
      ☰
    </button>

    <header class="header">
      <h1>NTV HUB</h1>
      <p>Навчально-тренувальний відділ ЕМД м. Рівне</p>
    </header>

    <section class="menu-grid">

      <button class="menu-card">
        <i data-lucide="heart-pulse"></i>
        <span>ЕМД</span>
      </button>

      <button class="menu-card">
        <i data-lucide="graduation-cap"></i>
        <span>НАВЧАННЯ</span>
      </button>

      <button class="menu-card">
        <i data-lucide="clipboard-check"></i>
        <span>ТЕСТИ</span>
      </button>

      <button class="menu-card">
        <i data-lucide="award"></i>
        <span>БПР</span>
      </button>

      <button class="menu-card">
        <i data-lucide="book-open"></i>
        <span>НОРМАТИВНА БАЗА</span>
      </button>

      <button class="menu-card">
        <i data-lucide="grid-2x2"></i>
        <span>ДОДАТКИ</span>
      </button>

      <button class="menu-card">
        <i data-lucide="newspaper"></i>
        <span>НОВИНИ</span>
      </button>

      <button class="menu-card">
        <i data-lucide="contact"></i>
        <span>КОНТАКТИ</span>
      </button>

    </section>

    <div class="actual-title">
      АКТУАЛЬНЕ СЬОГОДНІ
    </div>

    <img
      src="IMG_3499.jpeg"
      alt=""
      class="logo-image"
    >

  </main>


  <!-- =========================
       CHAT
  ========================= -->

  <section class="chat-screen" id="chatScreen">

    <div class="chat-header">
      💬 ЧАТ
    </div>

    <div class="chat-menu-bar">
      <button
        class="chat-menu-button"
        onclick="openSidePanel()"
        aria-label="Відкрити меню"
      >
        ☰
      </button>
    </div>

    <div class="chat-body">

      <div class="chat-placeholder">
        Тут буде робочий чат NTV HUB
      </div>

      <div class="chat-input-area">

        <input
          class="chat-input"
          type="text"
          placeholder="Написати повідомлення..."
        >

        <button class="chat-send">
          <i data-lucide="send"></i>
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       SIDE PANEL
  ========================= -->

  <div
    class="side-panel-background"
    id="sidePanelBackground"
    onclick="closeSidePanel(event)"
  >

    <aside class="side-panel">

      <h2 class="side-panel-title">
        NTV HUB
      </h2>

      <button class="side-item">
        <span class="side-item-icon">💬</span>
        <span>ЧАТ</span>
      </button>

      <button class="side-item">
        <span class="side-item-icon">🩺</span>
        <span>КЕЙСИ</span>
      </button>

      <button class="side-item">
        <span class="side-item-icon">📅</span>
        <span>КАЛЕНДАР НАВЧАНЬ</span>
      </button>

      <button class="side-item">
        <span class="side-item-icon">📢</span>
        <span>ОГОЛОШЕННЯ</span>
      </button>

      <button class="side-item">
        <span class="side-item-icon">⚠️</span>
        <span>ПОВІДОМИТИ ПРО ПРОБЛЕМУ</span>
      </button>

    </aside>

  </div>


  <div class="developer-credit">
    Розробник: Анна Соколова
  </div>


  <script>

    lucide.createIcons();

    function openChat() {
      document
        .getElementById("chatScreen")
        .classList.add("active");
    }

    function openSidePanel() {
      document
        .getElementById("sidePanelBackground")
        .classList.add("open");
    }

    function closeSidePanel(event) {
      if (
        !event ||
        event.target === document.getElementById("sidePanelBackground")
      ) {
        document
          .getElementById("sidePanelBackground")
          .classList.remove("open");
      }
    }

  </script>

</body>
</html>
