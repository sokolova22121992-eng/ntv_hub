<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTV HUB</title>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7f8;
      color: #172126;
    }

    .header {
      background: #ffffff;
      padding: 28px 22px 24px;
      border-bottom: 1px solid #e6eaec;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .subtitle {
      margin-top: 5px;
      color: #7b858b;
      font-size: 14px;
    }

    .container {
      padding: 22px 16px 35px;
      max-width: 650px;
      margin: auto;
    }

    .menu {
      display: grid;
      gap: 12px;
    }

    .item {
      background: #ffffff;
      border: 1px solid #e6eaec;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .item:active {
      transform: scale(0.98);
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #eef3f4;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 24px;
      height: 24px;
      stroke-width: 1.8;
    }

    .text {
      font-size: 17px;
      font-weight: 600;
    }

    .arrow {
      margin-left: auto;
      color: #9aa4a9;
    }

    .arrow svg {
      width: 19px;
      height: 19px;
    }

    .section {
      margin-top: 12px;
    }

    .subitems {
      display: none;
      padding: 8px 0 2px 64px;
      gap: 8px;
    }

    .subitem {
      background: #ffffff;
      border: 1px solid #e8ecee;
      border-radius: 12px;
      padding: 13px 15px;
      font-size: 14px;
      color: #465158;
    }

    .section.open .subitems {
      display: grid;
    }

    .section.open .arrow {
      transform: rotate(90deg);
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">NTV HUB</div>
    <div class="subtitle">Навчально-тренувальний відділ ЕМД</div>
  </header>

  <main class="container">

    <div class="menu">

      <!-- 1. ЕМД -->
      <div class="section">
        <div class="item" onclick="toggleSection(this)">
          <div class="icon">
            <i data-lucide="activity"></i>
          </div>
          <div class="text">ЕМД</div>
          <div class="arrow">
            <i data-lucide="chevron-right"></i>
          </div>
        </div>

        <div class="subitems">
          <div class="subitem">BLS</div>
          <div class="subitem">ALS</div>
          <div class="subitem">Травма</div>
          <div class="subitem">PBLS</div>
        </div>
      </div>

      <!-- 2. Нормативна база -->
      <div class="section">
        <div class="item" onclick="toggleSection(this)">
          <div class="icon">
            <i data-lucide="file-check"></i>
          </div>
          <div class="text">Нормативна база</div>
          <div class="arrow">
            <i data-lucide="chevron-right"></i>
          </div>
        </div>

        <div class="subitems">
          <div class="subitem">Документи</div>
          <div class="subitem">Накази</div>
        </div>
      </div>

      <!-- 3. Тести -->
      <a class="item" href="#">
        <div class="icon">
          <i data-lucide="clipboard-check"></i>
        </div>
        <div class="text">Тести</div>
        <div class="arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </a>

      <!-- 4. БПР -->
      <a class="item" href="#">
        <div class="icon">
          <i data-lucide="graduation-cap"></i>
        </div>
        <div class="text">БПР</div>
        <div class="arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </a>

      <!-- 5. Навчання -->
      <a class="item" href="#">
        <div class="icon">
          <i data-lucide="book-open"></i>
        </div>
        <div class="text">Навчання</div>
        <div class="arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </a>

      <!-- 6. Додатки -->
      <a class="item" href="#">
        <div class="icon">
          <i data-lucide="smartphone"></i>
        </div>
        <div class="text">Додатки</div>
        <div class="arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </a>

      <!-- 7. Новини -->
      <a class="item" href="#">
        <div class="icon">
          <i data-lucide="newspaper"></i>
        </div>
        <div class="text">Новини</div>
        <div class="arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </a>

      <!-- 8. Контакти -->
      <a class="item" href="#">
        <div class="icon">
          <i data-lucide="contact-round"></i>
        </div>
        <div class="text">Контакти</div>
        <div class="arrow">
          <i data-lucide="chevron-right"></i>
        </div>
      </a>

    </div>
  </main>

  <script>
    lucide.createIcons();

    function toggleSection(element) {
      const section = element.parentElement;
      section.classList.toggle("open");
    }
  </script>

</body>
</html>
