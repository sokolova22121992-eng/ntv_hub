<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NTV HUB</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style> 
    .menu-btn {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 1000;
  border: none;
  background: white;
  border-radius: 12px;
  padding: 10px 13px;
  font-size: 22px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.chat-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: #eef7fb;
  z-index: 900;
}

.chat-screen.active {
  display: block;
}

.chat-header {
  background: #1683d8;
  color: white;
  padding: 18px;
  text-align: center;
  font-weight: 700;
}

.chat-menu-btn {
  position: absolute;
  top: 12px;
  left: 15px;
  border: none;
  background: transparent;
  color: white;
  font-size: 25px;
}

.side-panel {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  width: 280px;
  height: 100%;
  background: white;
  padding: 70px 15px 20px;
  box-shadow: 4px 0 15px rgba(0,0,0,.15);
}

.side-panel.open {
  display: block;
}

.side-panel button {
  display: block;
  width: 100%;
  padding: 16px;
  margin-bottom: 10px;
  border: none;
  border-radius: 12px;
  background: #eef7fb;
  text-align: left;
  font-size: 16px;
}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #f7fbff, #eef6ff);
      color: #123b63;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 16px 35px;
    }

    /* HEADER */

    header {
      position: relative;
      text-align: center;
      margin-bottom: 22px;
      min-height: 115px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    /* МІСЦЕ ДЛЯ ЛОГОТИПА */

   .logo-image {
  display: block;
  width: 85px;
  height: 85px;
  object-fit: contain;
  margin: 12px auto 0;
  opacity: 0.4;
}

    .logo,
    .subtitle {
      position: relative;
      z-index: 1;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #55c7ee, #1769d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6c89a5;
      font-size: 14px;
    }

    /* MAIN GRID */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    /* CARDS */

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #dcecff;
      border-radius: 15px;
      padding: 12px 13px;
      min-height: 70px;
      box-shadow: 0 5px 16px rgba(31, 105, 170, 0.07);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(31, 105, 170, 0.11);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
    }

    /* ICONS */

    .icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #e8f8ff, #dcecff);
      color: #1769d1;
      flex-shrink: 0;
    }

    .icon svg {
      width: 21px;
      height: 21px;
    }

    /* TITLE */

    .title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.15;
    }

    .arrow {
      margin-left: auto;
      color: #8aa7c2;
      font-size: 17px;
    }

    /* SUBMENU */

    .submenu {
      display: none;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e4eff8;
    }

    .submenu.open {
      display: block;
    }

    .submenu-item {
      padding: 8px;
      margin: 3px 0;
      border-radius: 8px;
      color: #315b7d;
      background: #f7fbff;
      cursor: pointer;
      font-size: 14px;
    }

    .submenu-item:hover {
      background: #edf7ff;
      color: #1769d1;
    }

    /* NESTED MENU */

    .nested {
      margin-left: 14px;
      display: none;
    }

    .nested.open {
      display: block;
    }

    .nested-item {
      padding: 7px 9px;
      color: #55758f;
      border-left: 2px solid #c9e9fa;
      margin-bottom: 2px;
      font-size: 13px;
    }

    /* АКТУАЛЬНЕ */

    .today {
      margin-top: 20px;
      padding: 10px 4px;
      border-top: 1px solid #bcdcf0;
      border-bottom: 1px solid #bcdcf0;
      text-align: center;
      color: #1769d1;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .container {
        padding: 18px 12px 25px;
      }

      header {
        min-height: 95px;
        margin-bottom: 17px;
      }

      .logo {
        font-size: 32px;
      }

      .subtitle {
        font-size: 12px;
      }

      .logo-image {
        width: 135px;
        height: 135px;
      }

      .grid {
        gap: 8px;
      }

      .card {
        padding: 9px 10px;
        min-height: 62px;
        border-radius: 13px;
      }

      .card-header {
        gap: 8px;
        min-height: 42px;
      }

      .icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }

      .icon svg {
        width: 19px;
        height: 19px;
      }

      .title {
        font-size: 13px;
      }

      .today {
        margin-top: 16px;
        padding: 8px 4px;
        font-size: 11px;
      }
    }
  </style> 
</head>

<body>
<button class="menu-btn" onclick="openChat()">☰</button>

<div id="chatScreen" class="chat-screen">
  <button class="chat-menu-btn" onclick="toggleSidePanel()">☰</button>

  <div class="chat-header">💬 ЧАТ</div>

  <div class="chat-messages">
    <p>Чат NTV HUB</p>
  </div>

  <div id="sidePanel" class="side-panel">
    <button>💬 ЧАТ</button>
    <button>🩺 КЕЙСИ</button>
    <button>📅 КАЛЕНДАР НАВЧАНЬ</button>
    <button>📢 ОГОЛОШЕННЯ</button>
    <button>⚠️ ПОВІДОМИТИ ПРО ПРОБЛЕМУ</button>
  </div>
</div>
  
  <div class="container">

    <!-- HEADER -->

    <header>

      <!--
        ЛОГОТИП:
        Завантаж файл логотипа в GitHub
        з назвою logo.png.
        Він автоматично з'явиться тут
        напівпрозорим фоном.
      -->



      <div class="logo">
        NTV HUB
      </div>

      <div class="subtitle">
        Навчально-тренувальний відділ ЕМД м. Рівне
      </div>

    </header>


    <!-- ГОЛОВНЕ МЕНЮ -->

    <div class="grid">


      <!-- ЕМД -->

      <div class="card" onclick="toggleMenu('emd')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="heart-pulse"></i>
          </div>

          <div class="title">
            ЕМД
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>

        <div id="emd" class="submenu">

          <div class="submenu-item">BLS</div>
          <div class="submenu-item">PBLS</div>
          <div class="submenu-item">ALS</div>
          <div class="submenu-item">Травма</div>
          <div class="submenu-item">Педіатрія</div>

        </div>

      </div>


      <!-- НАВЧАННЯ -->

      <div class="card" onclick="toggleMenu('education')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="graduation-cap"></i>
          </div>

          <div class="title">
            НАВЧАННЯ
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>

        <div id="education" class="submenu">

          <div
            class="submenu-item"
            onclick="toggleNested(event, 'courses')"
          >
            Курси
            <span style="float:right;">›</span>
          </div>

          <div id="courses" class="nested">

            <div class="nested-item">
              Онлайн
            </div>

            <div class="nested-item">
              Офлайн
            </div>

          </div>

          <div class="submenu-item">
            Тренінги
          </div>

          <div class="submenu-item">
            Практичні навички
          </div>

        </div>

      </div>


      <!-- ТЕСТИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="clipboard-check"></i>
          </div>

          <div class="title">
            ТЕСТИ
          </div>

        </div>

      </div>


      <!-- БПР -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="badge-check"></i>
          </div>

          <div class="title">
            БПР
          </div>

        </div>

      </div>


      <!-- НОРМАТИВНА БАЗА -->

      <div class="card" onclick="toggleMenu('norms')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="file-text"></i>
          </div>

          <div class="title">
            НОРМАТИВНА БАЗА
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>

        <div id="norms" class="submenu">

          <div class="submenu-item">
            Накази
          </div>

          <div class="submenu-item">
            Документи
          </div>

          <div class="submenu-item">
            Протоколи
          </div>

        </div>

      </div>


      <!-- ДОДАТКИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="layout-grid"></i>
          </div>

          <div class="title">
            ДОДАТКИ
          </div>

        </div>

      </div>


      <!-- НОВИНИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="newspaper"></i>
          </div>

          <div class="title">
            НОВИНИ
          </div>

        </div>

      </div>


      <!-- КОНТАКТИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="phone"></i>
          </div>

          <div class="title">
            КОНТАКТИ
          </div>

        </div>

      </div>

    </div>


    <!-- АКТУАЛЬНЕ СЬОГОДНІ -->

    <div class="today">
      АКТУАЛЬНЕ СЬОГОДНІ
    </div>
<img src="IMG_3499.jpeg" alt="" class="logo-image">
  </div>


  <script>
function openChat() {
  document.getElementById("chatScreen").classList.add("active");
}

function toggleSidePanel() {
  document.getElementById("sidePanel").classList.toggle("open");
}
    lucide.createIcons();

    function toggleMenu(id) {
      const menu = document.getElementById(id);
      menu.classList.toggle("open");
    }

    function toggleNested(event, id) {
      event.stopPropagation();

      const menu = document.getElementById(id);
      menu.classList.toggle("open");
    }

  </script>

</body>
</html>
