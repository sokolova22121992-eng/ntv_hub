<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NTV HUB</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #f7fbff, #eef6ff);
      color: #123b63;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 45px 20px 60px;
    }

    /* HEADER */

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #55c7ee, #1769d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #6c89a5;
      font-size: 15px;
    }

    /* MAIN GRID */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    /* CARDS */

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #dcecff;
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 8px 25px rgba(31, 105, 170, 0.08);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(31, 105, 170, 0.13);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* ICONS */

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #e8f8ff, #dcecff);
      color: #1769d1;
      flex-shrink: 0;
    }

    .icon svg {
      width: 25px;
      height: 25px;
    }

    /* TITLE */

    .title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }

    /* ARROW */

    .arrow {
      margin-left: auto;
      color: #8aa7c2;
      font-size: 20px;
    }

    /* SUBMENU */

    .submenu {
      display: none;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e4eff8;
    }

    .submenu.open {
      display: block;
    }

    .submenu-item {
      padding: 11px 10px;
      margin: 4px 0;
      border-radius: 10px;
      color: #315b7d;
      background: #f7fbff;
      cursor: pointer;
      transition: 0.2s;
    }

    .submenu-item:hover {
      background: #edf7ff;
      color: #1769d1;
    }

    /* NESTED MENU */

    .nested {
      margin-left: 18px;
      margin-top: 4px;
      display: none;
    }

    .nested.open {
      display: block;
    }

    .nested-item {
      padding: 9px 10px;
      color: #55758f;
      border-left: 2px solid #c9e9fa;
      margin-bottom: 3px;
      cursor: pointer;
    }

    .nested-item:hover {
      color: #1769d1;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .container {
        padding: 30px 14px 40px;
      }

      .logo {
        font-size: 36px;
      }

      .subtitle {
        font-size: 14px;
      }

      .grid {
        gap: 12px;
      }

      .card {
        padding: 18px 14px;
        border-radius: 17px;
      }

      .icon {
        width: 42px;
        height: 42px;
        border-radius: 13px;
      }

      .icon svg {
        width: 22px;
        height: 22px;
      }

      .title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <header>
      <div class="logo">NTV HUB</div>
      <div class="subtitle">
        Навчально-тренувальний відділ ЕМД
      </div>
    </header>


    <!-- MAIN MENU -->

    <div class="grid">


      <!-- 1. ЕМД -->

      <div class="card" onclick="toggleMenu('emd')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="heart-pulse"></i>
          </div>

          <div class="title">
            ЕМД
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>


        <div id="emd" class="submenu">

          <div class="submenu-item">
            BLS
          </div>

          <div class="submenu-item">
            PBLS
          </div>

          <div class="submenu-item">
            ALS
          </div>

          <div class="submenu-item">
            Травма
          </div>

          <div class="submenu-item">
            Педіатрія
          </div>

        </div>

      </div>


      <!-- 2. НАВЧАННЯ -->

      <div class="card" onclick="toggleMenu('education')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="graduation-cap"></i>
          </div>

          <div class="title">
            НАВЧАННЯ
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>


        <div id="education" class="submenu">


          <!-- КУРСИ -->

          <div
            class="submenu-item"
            onclick="toggleNested(event, 'courses')"
          >
            Курси
            <span style="float:right;">
              ›
            </span>
          </div>


          <!-- ОНЛАЙН / ОФЛАЙН -->

          <div id="courses" class="nested">

            <div class="nested-item">
              Онлайн
            </div>

            <div class="nested-item">
              Офлайн
            </div>

          </div>


          <!-- ТРЕНІНГИ -->

          <div class="submenu-item">
            Тренінги
          </div>


          <!-- ПРАКТИЧНІ НАВИЧКИ -->

          <div class="submenu-item">
            Практичні навички
          </div>

        </div>

      </div>


      <!-- 3. ТЕСТИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="clipboard-check"></i>
          </div>

          <div class="title">
            ТЕСТИ
          </div>

        </div>

      </div>


      <!-- 4. БПР -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="badge-check"></i>
          </div>

          <div class="title">
            БПР
          </div>

        </div>

      </div>


      <!-- 5. НОРМАТИВНА БАЗА -->

      <div class="card" onclick="toggleMenu('norms')">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="file-text"></i>
          </div>

          <div class="title">
            НОРМАТИВНА БАЗА
          </div>

          <div class="arrow">
            ⌄
          </div>

        </div>


        <div id="norms" class="submenu">

          <div class="submenu-item">
            Накази
          </div>

          <div class="submenu-item">
            Документи
          </div>

          <div class="submenu-item">
            Протоколи
          </div>

        </div>

      </div>


      <!-- 6. ДОДАТКИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="layout-grid"></i>
          </div>

          <div class="title">
            ДОДАТКИ
          </div>

        </div>

      </div>


      <!-- 7. НОВИНИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="newspaper"></i>
          </div>

          <div class="title">
            НОВИНИ
          </div>

        </div>

      </div>


      <!-- 8. КОНТАКТИ -->

      <div class="card">

        <div class="card-header">

          <div class="icon">
            <i data-lucide="phone"></i>
          </div>

          <div class="title">
            КОНТАКТИ
          </div>

        </div>

      </div>


    </div>

  </div>


  <!-- JAVASCRIPT -->

  <script>

    lucide.createIcons();


    function toggleMenu(id) {

      const menu = document.getElementById(id);

      menu.classList.toggle("open");

    }


    function toggleNested(event, id) {

      event.stopPropagation();

      const menu = document.getElementById(id);

      menu.classList.toggle("open");

    }

  </script>

</body>
</html>
