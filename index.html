<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NTV HUB</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #eaf8ff 0%, #f8fcff 100%);
  color: #173f5c;
}

button {
  font: inherit;
  border: 0;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

/* =========================
   ГОЛОВНА
========================= */

.main-screen {
  min-height: 100vh;
  padding:
    calc(18px + env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    calc(25px + env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
}

.header {
  text-align: center;
  padding-top: 8px;
  margin-bottom: 18px;
  padding-left: 55px;
  padding-right: 55px;
}

.header h1 {
  margin: 0;
  color: #1769d1;
  font-size: clamp(25px, 7vw, 30px);
  line-height: 1.1;
  font-weight: 800;
}

.header p {
  margin: 6px auto 0;
  color: #58788e;
  font-size: clamp(11px, 3.2vw, 13px);
  line-height: 1.3;
}

/* ГОЛОВНЕ ☰ — СПРАВА ЗВЕРХУ */

.main-menu-button {
  position: absolute;
  top: calc(18px + env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));

  width: 50px;
  height: 50px;

  border-radius: 15px;
  background: white;
  color: #1769d1;

  font-size: 27px;
  line-height: 1;

  box-shadow: 0 5px 18px rgba(31,105,170,.14);

  z-index: 50;
}

/* ГОЛОВНЕ МЕНЮ */

.menu-grid {
  width: min(100%, 620px);
  margin: 0 auto;

  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(7px, 2vw, 10px);
}

.menu-card {
  min-height: clamp(67px, 17vw, 78px);

  border-radius: 17px;
  background: rgba(255,255,255,.96);
  color: #1769d1;

  box-shadow: 0 5px 16px rgba(31,105,170,.10);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;

  padding: 8px 5px;

  font-size: clamp(10px, 2.8vw, 12px);
  font-weight: 700;
  text-align: center;
}

.menu-card svg {
  width: clamp(21px, 6vw, 24px);
  height: clamp(21px, 6vw, 24px);
  stroke-width: 1.8;
  flex-shrink: 0;
}

/* АКТУАЛЬНЕ */

.actual-title {
  width: min(100%, 620px);
  height: 32px;

  margin: 12px auto 0;

  border-radius: 10px;
  border: 1px solid #dcecff;
  background: rgba(255,255,255,.75);

  display: flex;
  align-items: center;
  justify-content: center;

  color: #6c899d;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

.logo-image {
  display: block;
  width: 85px;
  height: 85px;
  object-fit: contain;
  margin: 12px auto 0;
  opacity: .4;
}

/* =========================
   ВНУТРІШНІ СТОРІНКИ
========================= */

.inner-screen {
  display: none;
  min-height: 100vh;

  padding:
    env(safe-area-inset-top)
    max(14px, env(safe-area-inset-right))
    calc(25px + env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
}

.inner-screen.active {
  display: block;
}

.inner-header {
  min-height: 70px;

  margin:
    0
    calc(-1 * max(14px, env(safe-area-inset-right)))
    15px
    calc(-1 * max(14px, env(safe-area-inset-left)));

  padding: 10px 16px;

  display: flex;
  align-items: center;
  gap: 12px;

  background: linear-gradient(135deg, #1769d1, #159bd7);
  color: white;
}

.back-button {
  width: 42px;
  height: 42px;
  flex-shrink: 0;

  border-radius: 13px;
  background: rgba(255,255,255,.18);
  color: white;

  font-size: 27px;
}

.inner-title {
  font-size: clamp(17px, 5vw, 20px);
  font-weight: 800;
  line-height: 1.2;
}

.submenu {
  width: min(100%, 620px);
  margin: 0 auto;

  display: grid;
  gap: 9px;
}

.submenu-item {
  width: 100%;
  min-height: 57px;

  padding: 11px 15px;

  border-radius: 15px;
  background: white;

  box-shadow: 0 4px 14px rgba(31,105,170,.09);

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  color: #245675;
  font-size: 14px;
  font-weight: 700;
  text-align: left;
}

.submenu-arrow {
  color: #1769d1;
  font-size: 21px;
  flex-shrink: 0;
}

/* =========================
   ЧАТ
========================= */

.chat-screen {
  display: none;
  min-height: 100vh;
  background: #f4fbff;

  padding-bottom: env(safe-area-inset-bottom);
}

.chat-screen.active {
  display: flex;
  flex-direction: column;
}

/* напис ЧАТ */

.chat-header {
  min-height: 70px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(135deg, #1769d1, #159bd7);
  color: white;

  font-size: 20px;
  font-weight: 800;
}

/* ☰ ЗЛІВА ПІД ЧАТОМ */

.chat-menu-bar {
  padding: 9px 14px;

  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;

  background: #eef7fb;
  border-bottom: 1px solid #dcecff;
}

.chat-menu-button {
  width: 50px;
  height: 50px;

  border-radius: 15px;
  background: white;
  color: #1769d1;

  font-size: 27px;
  line-height: 1;

  box-shadow: 0 5px 16px rgba(31,105,170,.14);
}

/* ПОВЕРНУТИСЯ НА ГОЛОВНЕ */

.home-return-button {
  min-height: 42px;

  padding: 8px 13px;

  border-radius: 12px;
  background: white;
  color: #1769d1;

  font-size: 13px;
  font-weight: 700;

  box-shadow: 0 4px 12px rgba(31,105,170,.10);
}

.chat-body {
  flex: 1;

  min-height: 0;

  padding: 14px;

  display: flex;
  flex-direction: column;
}

.chat-placeholder {
  flex: 1;
  min-height: 180px;

  border-radius: 18px;
  background: white;
  border: 1px solid #e0eef6;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  text-align: center;
  color: #7b96aa;
  font-size: 14px;
}

.chat-input-area {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.chat-input {
  min-width: 0;
  flex: 1;

  height: 48px;

  padding: 0 14px;

  border: 1px solid #d7e8f2;
  border-radius: 15px;

  background: white;
  outline: none;

  font-size: 14px;
}

.chat-send {
  width: 48px;
  height: 48px;
  flex-shrink: 0;

  border-radius: 15px;
  background: #1769d1;
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* =========================
   БІЧНЕ МЕНЮ
========================= */

.side-panel-background {
  position: fixed;
  inset: 0;

  display: none;

  z-index: 1000;

  background: rgba(10,45,75,.32);
}

.side-panel-background.open {
  display: block;
}

.side-panel {
  width: min(310px, 84vw);
  height: 100%;

  padding:
    calc(25px + env(safe-area-inset-top))
    15px
    calc(25px + env(safe-area-inset-bottom));

  background: white;

  box-shadow: 7px 0 25px rgba(0,0,0,.18);

  overflow-y: auto;
}

.side-panel-title {
  margin: 0 0 20px 8px;

  color: #1769d1;
  font-size: 21px;
  font-weight: 800;
}

.side-item {
  width: 100%;
  min-height: 55px;

  margin-bottom: 8px;
  padding: 0 14px;

  border-radius: 14px;
  background: #f4faff;

  display: flex;
  align-items: center;
  gap: 12px;

  color: #245675;

  font-size: 14px;
  font-weight: 700;
  text-align: left;
}

.side-icon {
  width: 28px;
  flex-shrink: 0;
  text-align: center;
  font-size: 20px;
}

/* =========================
   РОЗРОБНИК
========================= */

.developer-credit {
  position: fixed;
  right: 10px;
  bottom: calc(7px + env(safe-area-inset-bottom));

  z-index: 40;

  font-size: 10px;
  font-weight: 600;
  letter-spacing: .4px;

  color: transparent;
  -webkit-text-stroke: .6px rgba(23,105,209,.45);

  opacity: .65;
  pointer-events: none;
  white-space: nowrap;
}

/* =========================
   ДУЖЕ МАЛЕНЬКІ ЕКРАНИ
========================= */

@media (max-width: 350px) {

  .header {
    padding-left: 50px;
    padding-right: 50px;
  }

  .menu-grid {
    gap: 6px;
  }

  .menu-card {
    min-height: 65px;
    font-size: 9.5px;
  }

  .menu-card svg {
    width: 20px;
    height: 20px;
  }

  .developer-credit {
    font-size: 8px;
  }
}

/* =========================
   ВЕЛИКІ ЕКРАНИ
========================= */

@media (min-width: 700px) {

  .main-screen {
    max-width: 720px;
    margin: 0 auto;
  }

  .main-menu-button {
    right: max(14px, calc((100vw - 720px) / 2));
  }
}
</style>
</head>

<body>

<section id="mainScreen" class="main-screen">

<script>

/* =========================
   ІНІЦІАЛІЗАЦІЯ
========================= */

if (window.lucide) {
  lucide.createIcons();
}


/* =========================
   ПОКАЗ СТОРІНКИ
========================= */

function hideAll() {

  var innerPages = document.querySelectorAll(".inner-screen");

  for (var i = 0; i < innerPages.length; i++) {
    innerPages[i].classList.remove("active");
  }

  document
    .getElementById("mainScreen")
    .style.display = "none";

  document
    .getElementById("chatScreen")
    .classList.remove("active");
}


function showPage(id) {

  hideAll();

  var page = document.getElementById(id);

  if (page) {
    page.classList.add("active");
    window.scrollTo(0, 0);
  }
}


/* =========================
   ГОЛОВНЕ МЕНЮ
========================= */

function goHome() {

  var innerPages = document.querySelectorAll(".inner-screen");

  for (var i = 0; i < innerPages.length; i++) {
    innerPages[i].classList.remove("active");
  }

  document
    .getElementById("chatScreen")
    .classList.remove("active");

  document
    .getElementById("mainScreen")
    .style.display = "block";

  window.scrollTo(0, 0);
}


/* =========================
   ЧАТ
========================= */

function openChat() {

  var innerPages = document.querySelectorAll(".inner-screen");

  for (var i = 0; i < innerPages.length; i++) {
    innerPages[i].classList.remove("active");
  }

  document
    .getElementById("mainScreen")
    .style.display = "none";

  document
    .getElementById("chatScreen")
    .classList.add("active");

  window.scrollTo(0, 0);
}


/* =========================
   БІЧНЕ МЕНЮ
========================= */

function openSidePanel() {

  document
    .getElementById("sidePanelBackground")
    .classList.add("open");
}


function closeSidePanel(event) {

  var panel = document.getElementById("sidePanelBackground");

  if (
    !event ||
    event.target === panel
  ) {
    panel.classList.remove("open");
  }
}

</script>
